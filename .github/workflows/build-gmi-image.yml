name: Build GMI Nightscout Docker Image

on:
  push:
    branches:
      - gmi-hba1c

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nguyentiedung108-collab/cgm-remote-monitor-gmi:latest
            ghcr.io/nguyentiedung108-collab/cgm-remote-monitor-gmi:${{ github.sha }}
