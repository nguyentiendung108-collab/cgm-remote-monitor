services:
  - type: web
    name: nightscout
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: INSECURE_USE_HTTP
        value: true

      - key: NIGHTSCOUT_HOSTNAME
        value: "0.0.0.0"

      - key: MONGODB_URI
        sync: false

      - key: API_SECRET
        sync: false

      - key: DISPLAY_UNITS
        sync: false

      - key: ALARM_HIGH
        value: "on"

      - key: ALARM_LOW
        value: "on"

      - key: ALARM_TIMEAGO_URGENT
        value: "on"

      - key: ALARM_TIMEAGO_URGENT_MINS
        value: "30"

      - key: ALARM_TIMEAGO_WARN
        value: "on"

      - key: ALARM_TIMEAGO_WARN_MINS
        value: "15"

      - key: ALARM_TYPES
        value: "simple"

      - key: ALARM_URGENT_HIGH
        value: "on"

      - key: ALARM_URGENT_LOW
        value: "on"

      - key: BG_HIGH
        value: "260"

      - key: BG_LOW
        value: "55"

      - key: BG_TARGET_BOTTOM
        value: "80"

      - key: BG_TARGET_TOP
        value: "180"

      - key: CUSTOM_TITLE
        value: "Nightscout"

      - key: ENABLE
        value: "careportal basal dbsize rawbg iob maker cob bwp cage iage sage boluscalc pushover treatmentnotify loop pump profile food openaps bage alexa override speech cors"

      - key: NIGHT_MODE
        value: "off"

      - key: SHOW_RAWBG
        value: "never"

      - key: THEME
        value: "colors"

      - key: TIME_FORMAT
        value: "24"
